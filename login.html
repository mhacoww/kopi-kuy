<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #555; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Admin Panel</h2>
        <input type="email" id="emailInput" placeholder="Admin Email">
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="login()">Sign In</button>
        <p id="message"></p>
    </div>

    <script>
        // PASTE YOUR SUPABASE URL AND ANON KEY HERE
        const SUPABASE_URL = 'https://vukiwkaowsvlxsbmisjr.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_M0_lWHOn7NytFPK39sEgUQ_M1P0JnCL';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const messageBox = document.getElementById('message');

            messageBox.innerText = "Authenticating...";
            messageBox.style.color = "black";

            // Supabase handles the secure login check
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                messageBox.style.color = "red";
                messageBox.innerText = error.message;
            } else {
                messageBox.style.color = "green";
                messageBox.innerText = "Login successful! Redirecting...";
                
                // Redirect to the secure dashboard
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            }
        }
    </script>
</body>
</html>
