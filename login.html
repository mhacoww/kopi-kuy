<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Kuy - Demo Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #555; }
        #loginMessage { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>System Login</h2>
        <input type="text" id="usernameInput" placeholder="Username">
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="attemptLogin()">Login</button>
        <p id="loginMessage"></p>
    </div>

    <script>
        // REPLACE THIS with your actual SheetDB API URL
        const API_URL = 'https://sheetdb.io/api/v1/8bar2xccghxrf';

        async function attemptLogin() {
            const enteredUsername = document.getElementById('usernameInput').value;
            const enteredPassword = document.getElementById('passwordInput').value;
            const messageBox = document.getElementById('loginMessage');

            messageBox.innerText = "Checking credentials...";
            messageBox.style.color = "black";

            try {
                // Fetch the data from your Google Sheet
                const response = await fetch(API_URL);
                const users = await response.json();

                // Search the array for a matching username and password
                const foundUser = users.find(user => 
                    user.username === enteredUsername && user.password === enteredPassword
                );

                if (foundUser) {
                    messageBox.style.color = "green";
                    messageBox.innerText = `Welcome, ${foundUser.username}! Role: ${foundUser.user_level}`;
                    
                    // Optional: Save user role to session storage so other pages know who is logged in
                    sessionStorage.setItem('loggedInUser', JSON.stringify(foundUser));
                    
                } else {
                    messageBox.style.color = "red";
                    messageBox.innerText = "Invalid username or password.";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                messageBox.style.color = "red";
                messageBox.innerText = "System error. Please try again.";
            }
        }
    </script>
</body>
</html>
